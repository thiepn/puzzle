<!doctype html>
<html lang="en" data-theme="system">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#f3f0e8" />
  <meta name="color-scheme" content="light dark" />
  <meta name="referrer" content="no-referrer" />
  <meta name="application-name" content="Puzzle Arcade" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Puzzle Arcade" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'" />
  <meta name="description" content="An endless offline-first collection of polished puzzle games." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon.svg?v=2" />
  <link rel="icon" href="icon.svg?v=2" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
  <title>Puzzle Arcade</title>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="app" class="app-shell" aria-live="off">
    <header class="topbar">
      <button class="brand" data-action="home" aria-label="Puzzle Arcade home">
        <span class="brand-mark" aria-hidden="true">
          <span>A</span><span>3</span><span>•</span><span>⌟</span>
        </span>
        <span class="brand-word">Puzzle Arcade</span>
      </button>
      <nav class="main-nav" aria-label="Primary">
        <button class="nav-link is-active" data-route="home" aria-keyshortcuts="G P"><span class="nav-icon" aria-hidden="true">⌂</span><span class="nav-label">Puzzles</span></button>
        <button class="nav-link" data-route="learn" aria-keyshortcuts="G L"><span class="nav-icon" aria-hidden="true">?</span><span class="nav-label">Learn</span></button>
        <button class="nav-link" data-route="stats" aria-keyshortcuts="G S"><span class="nav-icon" aria-hidden="true">▥</span><span class="nav-label">Stats</span></button>
        <button class="nav-link" data-route="settings" aria-keyshortcuts="G O"><span class="nav-icon" aria-hidden="true">☰</span><span class="nav-label">Settings</span></button>
      </nav>
      <div class="top-actions">
        <button class="icon-button sound-toggle" data-action="sound-toggle" data-sound-state="on" aria-label="Mute puzzle sounds" aria-pressed="true" title="Mute puzzle sounds"><span aria-hidden="true">♪</span></button>
        <button class="icon-button" data-action="random" aria-label="Random puzzle" aria-keyshortcuts="R" title="Random puzzle (R)">↻</button>
        <button class="icon-button" data-action="search" aria-label="Search puzzles and actions" aria-keyshortcuts="Control+K Meta+K /" title="Quick switcher (Ctrl/⌘ K)">⌕</button>
        <button class="icon-button" data-action="controls" aria-label="Keyboard and touch controls" aria-keyshortcuts="?" title="Keyboard and touch controls (?)">?</button>
      </div>
    </header>

    <main id="main" tabindex="-1"></main>
    <div id="route-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

    <div id="overlay-root"></div>
    <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>
  </div>
  <script src="word-dictionary.js" defer></script>
  <script src="word-content.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
