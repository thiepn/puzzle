version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 2

  - package-ecosystem: "pip"
    directory: "/.github"
    schedule:
      interval: "monthly"
    groups:
      ci-python:
        patterns:
          - "*"
    open-pull-requests-limit: 2
