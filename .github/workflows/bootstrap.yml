name: Puzzle Arcade CI + Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: puzzle-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check app.js
      - run: node --check word-content.js
      - run: node --check sw.js
      - run: node scripts/validate-word-content.js
      - run: node scripts/test-service-worker.mjs
      - run: node scripts/test-word-entry.mjs
      - run: node scripts/release-check.mjs

  deploy:
    if: github.event_name == 'push'
    needs: release-gate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Stage production runtime
        run: |
          set -euo pipefail
          mkdir -p dist
          cp index.html styles.css app.js word-dictionary.js word-content.js manifest.webmanifest sw.js icon.svg icon-192.png icon-512.png dist/
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Production smoke
        shell: bash
        run: |
          set -euo pipefail
          base="${{ steps.deployment.outputs.page_url }}"
          base="${base%/}"
          echo "live_url=$base/"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL --retry 2 --retry-delay 1 "$base/" -o /tmp/live-index.html; then
              break
            fi
            sleep 2
          done
          grep -q 'Puzzle Arcade' /tmp/live-index.html
          curl -fsSL --retry 2 "$base/app.js" -o /tmp/live-app.js
          curl -fsSL --retry 2 "$base/sw.js" -o /tmp/live-sw.js
          curl -fsSL --retry 2 "$base/word-dictionary.js" -o /tmp/live-dictionary.js
          grep -q "const APP_VERSION = '1.2.0';" /tmp/live-app.js
          grep -q "const CACHE_VERSION = 'v21';" /tmp/live-sw.js
          grep -q 'trace' /tmp/live-dictionary.js
          grep -q 'adieu' /tmp/live-dictionary.js
          echo 'PRODUCTION_SMOKE=PASS'
