name: Verify Puzzle Arcade 1.0.1 Payload

on:
  push:
    branches: [ship-v1.0.0]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: puzzle-1-0-1-payload-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inspect fragment sequence
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t parts < <(find .deploy -maxdepth 1 -type f -name 'part-*' | sort -V)
          test "${#parts[@]}" -gt 0
          printf 'parts=%s\n' "${#parts[@]}"
          for p in "${parts[@]}"; do printf '%s %s\n' "$p" "$(wc -c < "$p")"; done
          cat "${parts[@]}" | tr -d '\r\n' > /tmp/payload.b64
          echo "payload_b64_bytes=$(wc -c < /tmp/payload.b64)"
          test -s /tmp/payload.b64

      - name: Decode base64 payload
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode /tmp/payload.b64 > /tmp/payload.bin
          test -s /tmp/payload.bin
          echo "payload_bytes=$(wc -c < /tmp/payload.bin)"
          echo "payload_sha256=$(sha256sum /tmp/payload.bin | awk '{print $1}')"
          file /tmp/payload.bin

      - name: Verify archive integrity and extract
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/puzzle-src
          mkdir -p /tmp/puzzle-src
          if xz -t /tmp/payload.bin >/dev/null 2>&1; then
            echo 'payload_format=xz-tar'
            xz -dc /tmp/payload.bin | tar -tf - >/tmp/archive-list.txt
            xz -dc /tmp/payload.bin | tar -xf - -C /tmp/puzzle-src
          elif unzip -t /tmp/payload.bin >/dev/null 2>&1; then
            echo 'payload_format=zip'
            unzip -l /tmp/payload.bin >/tmp/archive-list.txt
            unzip -q /tmp/payload.bin -d /tmp/puzzle-src
          else
            echo 'Payload is neither a valid xz stream nor ZIP archive.' >&2
            exit 1
          fi
          head -80 /tmp/archive-list.txt
          root="$(dirname "$(find /tmp/puzzle-src -maxdepth 4 -type f -name app.js -print -quit)")"
          test -n "$root"
          test -f "$root/index.html"
          test -f "$root/styles.css"
          test -f "$root/sw.js"
          echo "$root" > /tmp/puzzle-root
          echo "source_root=$root"
          find "$root" -maxdepth 2 -type f | sort | head -120

      - name: Rebuild generated word content when needed
        shell: bash
        run: |
          set -euo pipefail
          root="$(cat /tmp/puzzle-root)"
          if [ ! -f "$root/word-content.js" ]; then
            test -f "$root/scripts/build-word-content.py"
            test -f "$root/content/word-content-source.json"
            (cd "$root" && python3 scripts/build-word-content.py)
          fi
          test -f "$root/word-content.js"
          echo "word_content_sha256=$(sha256sum "$root/word-content.js" | awk '{print $1}')"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify release identity and run gates
        shell: bash
        run: |
          set -euo pipefail
          root="$(cat /tmp/puzzle-root)"
          cd "$root"
          grep -q "const APP_VERSION = '1.0.1';" app.js
          grep -Eq 'puzzle-arcade-core-v18|CACHE_PREFIX.*v18|\$\{CACHE_PREFIX\}v18' sw.js
          node --check app.js
          node --check word-content.js
          node --check sw.js
          node scripts/validate-word-content.js | tee /tmp/content-validation.log
          node scripts/test-service-worker.mjs | tee /tmp/service-worker.log
          node scripts/release-check.mjs | tee /tmp/release-check.log
          grep -Eq '"errors"[[:space:]]*:[[:space:]]*0|Content validation passed|0 errors' /tmp/content-validation.log
          grep -Eq 'PASS|"pass"[[:space:]]*:[[:space:]]*true' /tmp/service-worker.log
          grep -Eq 'PASS|"pass"[[:space:]]*:[[:space:]]*true' /tmp/release-check.log
          echo 'PAYLOAD_VERIFICATION=PASS'
