name: Puzzle Arcade CI + Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: puzzle-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      runtime_changed: ${{ steps.runtime-changes.outputs.changed || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Detect production runtime changes
        id: runtime-changes
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          changed_files="$(git diff --name-only HEAD^ HEAD)"
          if printf '%s\n' "$changed_files" | grep -Eq '^(index\.html|styles\.css|app\.js|word-dictionary\.js|word-content\.js|manifest\.webmanifest|sw\.js|icon\.svg|icon-192\.png|icon-512\.png|release-manifest\.json)$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Cumulative static release contract
        run: node scripts/release-check.mjs
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - name: Validate browser test syntax
        run: python -m py_compile scripts/test-play-browser.py scripts/test-difficulty-browser.py scripts/test-variety-browser.py scripts/test-generator-stress-browser.py scripts/test-completion-browser.py scripts/test-player-fuzz-browser.py scripts/test-resilience-browser.py scripts/test-endurance-browser.py scripts/test-recovery-browser.py scripts/test-qol-browser.py
      - name: Install browser test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r .github/requirements-ci.txt
          python -m playwright install --with-deps chromium
      - name: Browser interaction gate
        run: |
          set -euo pipefail
          python -m http.server 8080 >/tmp/puzzle-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python scripts/test-completion-browser.py --base-url http://127.0.0.1:8080/ --samples 1
          python scripts/test-play-browser.py --base-url http://127.0.0.1:8080/
          python scripts/test-difficulty-browser.py --base-url http://127.0.0.1:8080/ --samples 1
          python scripts/test-variety-browser.py --base-url http://127.0.0.1:8080/ --steps 3
          python scripts/test-generator-stress-browser.py --base-url http://127.0.0.1:8080/ --samples 4



  player-fuzz-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            games: five-letters,anagrams,theme-trail,cryptogram,killer-sudoku,arithmetic-cages,nonogram,islands,tents
          - shard: 2
            games: groups,letter-hive,word-pieces,word-search,kakuro,make-24,loop,hitori,rectangles
          - shard: 3
            games: word-ladder,word-grid,mini-crossword,sudoku,unequal,mines,bridges,binary,dominoes
          - shard: 4
            games: queens,number-path,light-up,towers,fillomino,network,sliding-tiles,lights-out,untangle
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - name: Install Chromium
        run: |
          python -m pip install --disable-pip-version-check -r .github/requirements-ci.txt
          python -m playwright install --with-deps chromium
      - name: Phase 17 player fuzz shard ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python -m http.server 8080 >/tmp/puzzle-player-fuzz-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python scripts/test-player-fuzz-browser.py --base-url http://127.0.0.1:8080/ --games "${{ matrix.games }}" --difficulties Medium --steps 12


  endurance-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - name: Install Chromium
        run: |
          python -m pip install --disable-pip-version-check -r .github/requirements-ci.txt
          python -m playwright install --with-deps chromium
      - name: Phase 19 long-session endurance
        run: |
          set -euo pipefail
          mkdir -p test-results/endurance
          python -m http.server 8080 >/tmp/puzzle-endurance-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python scripts/test-endurance-browser.py \
            --base-url http://127.0.0.1:8080/ \
            --cycles 3 \
            --output test-results/endurance/release.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: phase19-endurance-release
          path: test-results/endurance/release.json
          retention-days: 30
          if-no-files-found: error


  recovery-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - name: Install Chromium
        run: |
          python -m pip install --disable-pip-version-check -r .github/requirements-ci.txt
          python -m playwright install --with-deps chromium
      - name: Phase 20 backup restore reset recovery
        run: |
          set -euo pipefail
          mkdir -p test-results/recovery
          python -m http.server 8080 >/tmp/puzzle-recovery-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python scripts/test-recovery-browser.py \
            --base-url http://127.0.0.1:8080/ \
            --output test-results/recovery/release.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: phase20-recovery-release
          path: test-results/recovery/release.json
          retention-days: 30
          if-no-files-found: error


  qol-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - name: Install Chromium
        run: |
          python -m pip install --disable-pip-version-check -r .github/requirements-ci.txt
          python -m playwright install --with-deps chromium
      - name: QoL keyboard and mobile UI certification
        run: |
          set -euo pipefail
          mkdir -p test-results/qol
          python -m http.server 8080 >/tmp/puzzle-qol-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python scripts/test-qol-browser.py \
            --base-url http://127.0.0.1:8080/ \
            --output test-results/qol/release.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qol-keyboard-mobile-release
          path: test-results/qol/release.json
          retention-days: 30
          if-no-files-found: error

  resilience-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - name: Install Playwright browser
        run: |
          python -m pip install --disable-pip-version-check -r .github/requirements-ci.txt
          python -m playwright install --with-deps "${{ matrix.browser }}"
      - name: Phase 18 browser resilience
        run: |
          set -euo pipefail
          python -m http.server 8080 >/tmp/puzzle-resilience-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python scripts/test-resilience-browser.py --base-url http://127.0.0.1:8080/ --browser "${{ matrix.browser }}"

  certification-summary:
    if: always()
    needs: [release-gate, player-fuzz-gate, endurance-gate, recovery-gate, qol-gate, resilience-matrix]
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every production certification gate
        env:
          RELEASE_GATE: ${{ needs.release-gate.result }}
          PLAYER_FUZZ_GATE: ${{ needs.player-fuzz-gate.result }}
          ENDURANCE_GATE: ${{ needs.endurance-gate.result }}
          RECOVERY_GATE: ${{ needs.recovery-gate.result }}
          QOL_GATE: ${{ needs.qol-gate.result }}
          RESILIENCE_MATRIX: ${{ needs.resilience-matrix.result }}
        run: |
          set -euo pipefail
          for result in "$RELEASE_GATE" "$PLAYER_FUZZ_GATE" "$ENDURANCE_GATE" "$RECOVERY_GATE" "$QOL_GATE" "$RESILIENCE_MATRIX"; do
            test "$result" = "success"
          done

  deploy:
    if: github.event_name == 'push' && needs.certification-summary.result == 'success' && needs.release-gate.outputs.runtime_changed == 'true'
    needs: [release-gate, certification-summary]
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Stage production runtime
        run: |
          set -euo pipefail
          mkdir -p dist
          cp index.html styles.css app.js word-dictionary.js word-content.js manifest.webmanifest sw.js icon.svg icon-192.png icon-512.png release-manifest.json dist/
          touch dist/.nojekyll
          node scripts/build-release-integrity.mjs dist
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Production smoke
        shell: bash
        run: |
          set -euo pipefail
          base="${{ steps.deployment.outputs.page_url }}"
          base="${base%/}"
          echo "live_url=$base/"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL --retry 2 --retry-delay 1 "$base/" -o /tmp/live-index.html; then
              break
            fi
            sleep 2
          done
          grep -q 'Puzzle Arcade' /tmp/live-index.html
          curl -fsSL --retry 2 "$base/app.js" -o /tmp/live-app.js
          curl -fsSL --retry 2 "$base/sw.js" -o /tmp/live-sw.js
          curl -fsSL --retry 2 "$base/word-dictionary.js" -o /tmp/live-dictionary.js
          grep -q 'trace' /tmp/live-dictionary.js
          grep -q 'adieu' /tmp/live-dictionary.js
          node scripts/verify-deployed-release.mjs "$base"
          echo 'PRODUCTION_SMOKE=PASS'
