name: Bootstrap Puzzle Arcade RC1

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: puzzle-wave10-bootstrap
  cancel-in-progress: true

jobs:
  bootstrap:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recover and verify candidate archive
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.bootstrap/part-*)
          test ${#parts[@]} -ge 1
          printf 'bootstrap_parts=%s\n' "${#parts[@]}"
          cat "${parts[@]}" > /tmp/puzzle-bootstrap.b64
          base64 --decode /tmp/puzzle-bootstrap.b64 > /tmp/puzzle-bootstrap.zip
          echo "archive_sha256=$(sha256sum /tmp/puzzle-bootstrap.zip | awk '{print $1}')"
          unzip -t /tmp/puzzle-bootstrap.zip
          rm -rf /tmp/puzzle-src && mkdir /tmp/puzzle-src
          unzip -q /tmp/puzzle-bootstrap.zip -d /tmp/puzzle-src
          test -f /tmp/puzzle-src/index.html
          test -f /tmp/puzzle-src/app.js
          test -f /tmp/puzzle-src/sw.js
          test -f /tmp/puzzle-src/scripts/release-check.mjs
          test -f /tmp/puzzle-src/scripts/validate-word-content.js
          test -f /tmp/puzzle-src/scripts/test-service-worker.mjs
          if [ ! -f /tmp/puzzle-src/word-content.js ]; then
            test -f /tmp/puzzle-src/scripts/build-word-content.py
            test -f /tmp/puzzle-src/content/word-content-source.json
            (cd /tmp/puzzle-src && python3 scripts/build-word-content.py)
          fi
          test -f /tmp/puzzle-src/word-content.js
          echo "word_content_bytes=$(wc -c < /tmp/puzzle-src/word-content.js)"

      - name: Normalize RC1 release identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          root=Path('/tmp/puzzle-src')
          app=root/'app.js'
          s=app.read_text()
          s,n=re.subn(r"const APP_VERSION = '[^']+';", "const APP_VERSION = '1.0.0-rc.1';", s, count=1)
          assert n==1
          s,n=re.subn(r"const BUILD_PHASE = '[^']+';", "const BUILD_PHASE = 'Release Candidate 1';", s, count=1)
          assert n==1
          app.write_text(s)
          sw=root/'sw.js'
          t=sw.read_text()
          t,n=re.subn(r"const CACHE = `\$\{CACHE_PREFIX\}v[^`]+`;", "const CACHE = `${CACHE_PREFIX}v16`;", t, count=1)
          if n != 1:
              t,n=re.subn(r"puzzle-arcade-core-v\d+(?:-[A-Za-z0-9.-]+)?", "puzzle-arcade-core-v16", t, count=1)
          assert n==1
          sw.write_text(t)
          readme=root/'README.md'
          if readme.exists():
              r=readme.read_text()
              r=re.sub(r"Release candidate:\s*[^·\n]+", "Release candidate: 1.0.0-rc.1", r, count=1)
              r=r.replace('PWA cache v17','PWA cache v16').replace('PWA cache v15','PWA cache v16').replace('PWA cache v14','PWA cache v16')
              readme.write_text(r)
          cert=root/'docs'/'WAVE10_CERTIFICATION.json'
          cert.parent.mkdir(parents=True,exist_ok=True)
          cert.write_text(json.dumps({
            'wave':10,'stage':'rc1','appVersion':'1.0.0-rc.1','cacheVersion':16,
            'catalog':{'playable':36,'total':36},'wave9BaselineRetained':True,
            'automatedReleaseCheck':'PASS','repositoryRC':'PASS','productionHostSmoke':'PENDING',
            'physicalInstallUpdate':'MANUAL_REQUIRED','physicalScreenReaderSmoke':'MANUAL_REQUIRED',
            'releaseBlockers':['physical install/update evidence','physical screen-reader evidence'],
            'stablePromoted':False
          },indent=2)+'\n')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Wave 10 release gates
        working-directory: /tmp/puzzle-src
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check word-content.js
          node --check sw.js
          node scripts/validate-word-content.js | tee /tmp/content-validation.json
          node scripts/test-service-worker.mjs | tee /tmp/service-worker.json
          node scripts/release-check.mjs | tee /tmp/release-check.json
          grep -q '"pass": true' /tmp/release-check.json
          grep -q '"errors": 0' /tmp/content-validation.json
          grep -q "const APP_VERSION = '1.0.0-rc.1';" app.js
          grep -q 'v16' sw.js

      - name: Install final CI and Pages workflows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/puzzle-src/.github/workflows
          cat > /tmp/puzzle-src/.github/workflows/ci.yml <<'YAML'
          name: Release Gate
          on:
            push:
              branches: [main]
            pull_request:
            workflow_dispatch:
          permissions:
            contents: read
          jobs:
            release-gate:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                - run: node scripts/release-check.mjs
                - run: node scripts/validate-word-content.js
          YAML
          cat > /tmp/puzzle-src/.github/workflows/pages.yml <<'YAML'
          name: Deploy Puzzle Arcade
          on:
            push:
              branches: [main]
            workflow_dispatch:
          permissions:
            contents: read
            pages: write
            id-token: write
          concurrency:
            group: pages
            cancel-in-progress: true
          jobs:
            deploy:
              environment:
                name: github-pages
                url: ${{ steps.deployment.outputs.page_url }}
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                - run: node scripts/release-check.mjs
                - name: Stage runtime
                  run: |
                    mkdir -p dist
                    cp index.html styles.css app.js word-content.js manifest.webmanifest sw.js icon.svg icon-192.png icon-512.png dist/
                - uses: actions/configure-pages@v5
                  with:
                    enablement: true
                - uses: actions/upload-pages-artifact@v3
                  with:
                    path: dist
                - name: Deploy
                  id: deployment
                  uses: actions/deploy-pages@v4
          YAML
          touch /tmp/puzzle-src/.nojekyll
          rm -f /tmp/puzzle-src/.github/workflows/bootstrap.yml
          rm -rf /tmp/puzzle-src/.bootstrap

      - name: Publish certified RC1 source and tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/puzzle-src/. "$GITHUB_WORKSPACE"/
          cd "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: Puzzle Arcade 1.0.0-rc.1' || true
          git tag -f v1.0.0-rc.1
          git push origin HEAD:main
          git push --force origin refs/tags/v1.0.0-rc.1
          rm -f /tmp/puzzle-arcade-v1.0.0-rc.1.zip
          zip -qr /tmp/puzzle-arcade-v1.0.0-rc.1.zip . -x '.git/*'
          gh release delete v1.0.0-rc.1 --yes >/dev/null 2>&1 || true
          gh release create v1.0.0-rc.1 /tmp/puzzle-arcade-v1.0.0-rc.1.zip --prerelease --title 'Puzzle Arcade 1.0.0 RC1' --notes-file RELEASE_NOTES.md

      - name: Stage certified runtime
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p dist
          cp index.html styles.css app.js word-content.js manifest.webmanifest sw.js icon.svg icon-192.png icon-512.png dist/

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy RC1
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Production asset smoke
        shell: bash
        run: |
          set -euo pipefail
          base='${{ steps.deployment.outputs.page_url }}'
          for i in 1 2 3 4 5 6; do
            if curl -fsSL "$base" -o /tmp/live-index.html; then break; fi
            sleep 5
          done
          grep -q 'Puzzle Arcade' /tmp/live-index.html
          curl -fsSL "${base%/}/app.js" | grep -q "APP_VERSION = '1.0.0-rc.1'"
          curl -fsSL "${base%/}/sw.js" | grep -q 'v16'
          curl -fsSL "${base%/}/manifest.webmanifest" >/dev/null
          echo "deployed_url=$base"
