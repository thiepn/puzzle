name: Diagnose Puzzle Arcade Bootstrap

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect bootstrap fragments
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          parts=sorted(Path('.bootstrap').glob('part-*'), key=lambda p:int(p.name.rsplit('-',1)[1]))
          allowed=set('ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=')
          total_clean=0
          for p in parts:
              s=p.read_text(errors='replace')
              clean=''.join(c for c in s if c in allowed)
              bad=[i for i,c in enumerate(s) if c not in allowed]
              total_clean += len(clean)
              print(f'{p.name}: raw={len(s)} clean={len(clean)} mod4={len(clean)%4} bad={len(bad)}')
              if bad:
                  groups=[]
                  start=prev=bad[0]
                  for x in bad[1:]:
                      if x==prev+1:
                          prev=x
                      else:
                          groups.append((start,prev)); start=prev=x
                  groups.append((start,prev))
                  for a,b in groups[:20]:
                      lo=max(0,a-50); hi=min(len(s),b+51)
                      print(f'  bad[{a}:{b}] context={s[lo:hi]!r}')
              print(f'  prefix={s[:24]!r} suffix={s[-24:]!r}')
          print(f'total_clean={total_clean} mod4={total_clean%4}')
          PY
