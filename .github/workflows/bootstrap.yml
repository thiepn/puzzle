name: Puzzle Arcade CI + Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: puzzle-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check app.js
      - run: node --check word-content.js
      - run: node --check sw.js
      - run: node scripts/validate-word-content.js
      - run: node scripts/test-service-worker.mjs
      - run: node scripts/test-word-entry.mjs
      - run: node scripts/test-phase18-resilience.mjs
      - run: node scripts/test-phase19-endurance.mjs
      - run: node scripts/release-check.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate browser test syntax
        run: python -m py_compile scripts/test-play-browser.py scripts/test-difficulty-browser.py scripts/test-variety-browser.py scripts/test-generator-stress-browser.py scripts/test-completion-browser.py scripts/test-player-fuzz-browser.py scripts/test-resilience-browser.py scripts/test-endurance-browser.py
      - name: Install browser test dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Browser interaction gate
        run: |
          set -euo pipefail
          python -m http.server 8080 >/tmp/puzzle-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python scripts/test-completion-browser.py --base-url http://127.0.0.1:8080/ --samples 1
          python scripts/test-play-browser.py --base-url http://127.0.0.1:8080/
          python scripts/test-difficulty-browser.py --base-url http://127.0.0.1:8080/ --samples 1
          python scripts/test-variety-browser.py --base-url http://127.0.0.1:8080/ --steps 3
          python scripts/test-generator-stress-browser.py --base-url http://127.0.0.1:8080/ --samples 4



  player-fuzz-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            games: five-letters,anagrams,theme-trail,cryptogram,killer-sudoku,arithmetic-cages,nonogram,islands,tents
          - shard: 2
            games: groups,letter-hive,word-pieces,word-search,kakuro,make-24,loop,hitori,rectangles
          - shard: 3
            games: word-ladder,word-grid,mini-crossword,sudoku,unequal,mines,bridges,binary,dominoes
          - shard: 4
            games: queens,number-path,light-up,towers,fillomino,network,sliding-tiles,lights-out,untangle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Phase 17 player fuzz shard ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python -m http.server 8080 >/tmp/puzzle-player-fuzz-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python scripts/test-player-fuzz-browser.py --base-url http://127.0.0.1:8080/ --games "${{ matrix.games }}" --difficulties Medium --steps 12


  endurance-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Phase 19 long-session endurance
        run: |
          set -euo pipefail
          mkdir -p test-results/endurance
          python -m http.server 8080 >/tmp/puzzle-endurance-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python scripts/test-endurance-browser.py \
            --base-url http://127.0.0.1:8080/ \
            --cycles 3 \
            --output test-results/endurance/release.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase19-endurance-release
          path: test-results/endurance/release.json
          retention-days: 30

  resilience-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright browser
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps "${{ matrix.browser }}"
      - name: Phase 18 browser resilience
        run: |
          set -euo pipefail
          python -m http.server 8080 >/tmp/puzzle-resilience-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python scripts/test-resilience-browser.py --base-url http://127.0.0.1:8080/ --browser "${{ matrix.browser }}"

  deploy:
    if: github.event_name == 'push'
    needs: [release-gate, player-fuzz-gate, endurance-gate, resilience-matrix]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Stage production runtime
        run: |
          set -euo pipefail
          mkdir -p dist
          cp index.html styles.css app.js word-dictionary.js word-content.js manifest.webmanifest sw.js icon.svg icon-192.png icon-512.png dist/
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Production smoke
        shell: bash
        run: |
          set -euo pipefail
          base="${{ steps.deployment.outputs.page_url }}"
          base="${base%/}"
          echo "live_url=$base/"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL --retry 2 --retry-delay 1 "$base/" -o /tmp/live-index.html; then
              break
            fi
            sleep 2
          done
          grep -q 'Puzzle Arcade' /tmp/live-index.html
          curl -fsSL --retry 2 "$base/app.js" -o /tmp/live-app.js
          curl -fsSL --retry 2 "$base/sw.js" -o /tmp/live-sw.js
          curl -fsSL --retry 2 "$base/word-dictionary.js" -o /tmp/live-dictionary.js
          grep -q "const APP_VERSION = '1.12.0';" /tmp/live-app.js
          grep -q "const CACHE_VERSION = 'v31';" /tmp/live-sw.js
          grep -q 'trace' /tmp/live-dictionary.js
          grep -q 'adieu' /tmp/live-dictionary.js
          echo 'PRODUCTION_SMOKE=PASS'
