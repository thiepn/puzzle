name: Rescue Puzzle Arcade Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: puzzle-site-rescue
  cancel-in-progress: true

jobs:
  rescue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recover and validate source archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib

          parts = sorted(Path('.bootstrap').glob('part-*'), key=lambda p: int(p.name.rsplit('-',1)[1]))
          if len(parts) != 9:
              raise SystemExit(f'Expected 9 bootstrap fragments, found {len(parts)}')
          raw = ''.join(p.read_text() for p in parts)
          marker = '[... ELLIPSIZATION ...]'
          count = raw.count(marker)
          print(f'ellipsis_marker_count={count}')
          if count != 1:
              raise SystemExit(f'Expected exactly one known transfer marker, found {count}')
          repaired = raw.replace(marker, '')
          if len(repaired) != 150000:
              raise SystemExit(f'Unexpected repaired base64 length: {len(repaired)}')
          try:
              data = base64.b64decode(repaired, validate=True)
          except Exception as exc:
              raise SystemExit(f'Strict base64 decode failed after deterministic repair: {exc}')
          if not data.startswith(b'PK'):
              raise SystemExit('Recovered payload does not have ZIP magic')
          Path('/tmp/puzzle-bootstrap.zip').write_bytes(data)
          print(f'archive_bytes={len(data)}')
          print(f'archive_sha256={hashlib.sha256(data).hexdigest()}')
          PY

          unzip -t /tmp/puzzle-bootstrap.zip
          rm -rf /tmp/puzzle-src
          mkdir -p /tmp/puzzle-src
          unzip -q /tmp/puzzle-bootstrap.zip -d /tmp/puzzle-src
          test -f /tmp/puzzle-src/index.html
          test -f /tmp/puzzle-src/app.js
          test -f /tmp/puzzle-src/styles.css
          test -f /tmp/puzzle-src/sw.js
          test -f /tmp/puzzle-src/scripts/release-check.mjs
          test -f /tmp/puzzle-src/scripts/validate-word-content.js
          test -f /tmp/puzzle-src/scripts/test-service-worker.mjs

      - name: Generate word database when needed
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/puzzle-src
          if [ ! -f word-content.js ]; then
            test -f scripts/build-word-content.py
            test -f content/word-content-source.json
            python3 scripts/build-word-content.py
          fi
          test -s word-content.js
          echo "word_content_bytes=$(wc -c < word-content.js)"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run recovered-source release gates
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/puzzle-src
          grep -m1 -E "APP_VERSION|BUILD_PHASE" app.js || true
          grep -m1 -E "CACHE_PREFIX|const CACHE" sw.js || true
          node --check app.js
          node --check word-content.js
          node --check sw.js
          node scripts/validate-word-content.js
          node scripts/test-service-worker.mjs
          node scripts/release-check.mjs

      - name: Install production CI and Pages workflows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/puzzle-src/.github/workflows
          cat > /tmp/puzzle-src/.github/workflows/ci.yml <<'YAML'
          name: Release Gate
          on:
            push:
              branches: [main]
            pull_request:
            workflow_dispatch:
          permissions:
            contents: read
          jobs:
            release-gate:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                - run: node --check app.js
                - run: node --check word-content.js
                - run: node --check sw.js
                - run: node scripts/validate-word-content.js
                - run: node scripts/test-service-worker.mjs
                - run: node scripts/release-check.mjs
          YAML
          cat > /tmp/puzzle-src/.github/workflows/pages.yml <<'YAML'
          name: Deploy Puzzle Arcade
          on:
            push:
              branches: [main]
            workflow_dispatch:
          permissions:
            contents: read
            pages: write
            id-token: write
          concurrency:
            group: pages
            cancel-in-progress: true
          jobs:
            deploy:
              environment:
                name: github-pages
                url: ${{ steps.deployment.outputs.page_url }}
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                - name: Verify production source
                  run: |
                    node --check app.js
                    node --check word-content.js
                    node --check sw.js
                    node scripts/validate-word-content.js
                    node scripts/test-service-worker.mjs
                    node scripts/release-check.mjs
                - name: Stage runtime
                  run: |
                    rm -rf dist
                    mkdir dist
                    cp index.html styles.css app.js word-content.js manifest.webmanifest sw.js icon.svg icon-192.png icon-512.png dist/
                    touch dist/.nojekyll
                - uses: actions/configure-pages@v5
                  with:
                    enablement: true
                - uses: actions/upload-pages-artifact@v3
                  with:
                    path: dist
                - name: Deploy
                  id: deployment
                  uses: actions/deploy-pages@v4
          YAML
          touch /tmp/puzzle-src/.nojekyll
          rm -f /tmp/puzzle-src/.github/workflows/bootstrap.yml
          rm -rf /tmp/puzzle-src/.bootstrap /tmp/puzzle-src/.payload /tmp/puzzle-src/.deploy

      - name: Publish real source to main
        shell: bash
        run: |
          set -euo pipefail
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/puzzle-src/. "$GITHUB_WORKSPACE"/
          cd "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: restore deployable Puzzle Arcade source'
          git push origin HEAD:main
