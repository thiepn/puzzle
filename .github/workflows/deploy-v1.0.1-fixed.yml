name: Deploy verified Puzzle Arcade 1.0.1

on:
  push:
    branches: [rescue-v1.0.1-final]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: puzzle-v1-0-1-final-promotion
  cancel-in-progress: true

jobs:
  verify-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify exact source and word payloads
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .rescue/source.tar.xz.b64 > /tmp/puzzle-source.tar.xz
          echo "afbd5a14c697ec254bfe54af19f23850ea4704a10601fcecaed52d6125f2b694  /tmp/puzzle-source.tar.xz" | sha256sum -c -
          xz -t /tmp/puzzle-source.tar.xz
          base64 --decode .rescue/word-content.js.xz.b64 > /tmp/word-content.js.xz
          echo "687d78795ef173ae9bbbe0ab4f46bf27e8f686cd0887ab29e5b6cf698d3734c0  /tmp/word-content.js.xz" | sha256sum -c -
          xz -t /tmp/word-content.js.xz
          rm -rf /tmp/puzzle-src
          mkdir -p /tmp/puzzle-src
          tar -xJf /tmp/puzzle-source.tar.xz -C /tmp/puzzle-src
          xz -dc /tmp/word-content.js.xz > /tmp/puzzle-src/word-content.js
          echo "b6ec38d024085714b1e34e51949677ac3592e365be31b102d5dc5acecddf89ac  /tmp/puzzle-src/word-content.js" | sha256sum -c -
          grep -q "const APP_VERSION = '1.0.1';" /tmp/puzzle-src/app.js
          grep -q "const CACHE_VERSION = 'v18';" /tmp/puzzle-src/sw.js

      - name: Run audited release gates
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/puzzle-src
          node --check app.js
          node --check word-content.js
          node --check sw.js
          node scripts/validate-word-content.js | tee /tmp/content-validation.log
          node scripts/test-service-worker.mjs | tee /tmp/service-worker.log
          node scripts/release-check.mjs | tee /tmp/release-check.log
          grep -q '"errors": 0' /tmp/content-validation.log
          grep -q '"failed": 0' /tmp/service-worker.log
          grep -q '"pass": true' /tmp/release-check.log

      - name: Promote app source without changing workflow permissions
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          main_sha="$(git rev-parse origin/main)"
          git show origin/main:.github/workflows/bootstrap.yml > /tmp/preserved-bootstrap.yml
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/puzzle-src/. "$GITHUB_WORKSPACE"/
          cd "$GITHUB_WORKSPACE"
          mkdir -p .github/workflows docs
          cp /tmp/preserved-bootstrap.yml .github/workflows/bootstrap.yml
          touch .nojekyll
          cat > docs/RELEASE_STATUS.json <<'JSON'
          {
            "version": "1.0.1",
            "cacheVersion": 18,
            "catalogGames": 36,
            "automatedReleaseGate": "PASS",
            "contentValidation": "PASS",
            "serviceWorkerRegression": "PASS",
            "manualPhysicalPwaUpdate": "NOT_INDEPENDENTLY_VERIFIED",
            "manualScreenReaderTesting": "NOT_INDEPENDENTLY_VERIFIED"
          }
          JSON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          tree_sha="$(git write-tree)"
          new_sha="$(printf '%s\n' 'release: Puzzle Arcade 1.0.1 audited fixes' | git commit-tree "$tree_sha" -p "$main_sha")"
          git push origin "$new_sha:refs/heads/main"
          git tag -f v1.0.1 "$new_sha"
          git push --force origin refs/tags/v1.0.1
          echo "production_commit=$new_sha"
          echo "PROMOTION=PASS"
