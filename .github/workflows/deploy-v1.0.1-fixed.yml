name: Deploy verified Puzzle Arcade 1.0.1

on:
  push:
    branches: [rescue-v1.0.1-final]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: puzzle-v1-0-1-final-promotion
  cancel-in-progress: false

jobs:
  verify-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify source payload
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .rescue/source.tar.xz.b64 > /tmp/puzzle-source.tar.xz
          echo "afbd5a14c697ec254bfe54af19f23850ea4704a10601fcecaed52d6125f2b694  /tmp/puzzle-source.tar.xz" | sha256sum -c -
          xz -t /tmp/puzzle-source.tar.xz
          rm -rf /tmp/puzzle-src
          mkdir -p /tmp/puzzle-src
          tar -xJf /tmp/puzzle-source.tar.xz -C /tmp/puzzle-src
          for f in index.html styles.css app.js sw.js manifest.webmanifest icon.svg icon-192.png icon-512.png scripts/build-word-content.py scripts/validate-word-content.js scripts/test-service-worker.mjs scripts/release-check.mjs content/word-content-source.json; do
            test -f "/tmp/puzzle-src/$f"
          done
          grep -q "const APP_VERSION = '1.0.1';" /tmp/puzzle-src/app.js
          grep -q "const CACHE_VERSION = 'v18';" /tmp/puzzle-src/sw.js

      - name: Generate deterministic word content
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/puzzle-src
          python3 scripts/build-word-content.py
          test -s word-content.js

      - name: Run release gates
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/puzzle-src
          node --check app.js
          node --check word-content.js
          node --check sw.js
          node scripts/validate-word-content.js | tee /tmp/content-validation.log
          node scripts/test-service-worker.mjs | tee /tmp/service-worker.log
          node scripts/release-check.mjs | tee /tmp/release-check.log
          grep -q '"errors": 0' /tmp/content-validation.log
          grep -q '"failed": 0' /tmp/service-worker.log
          grep -q '"pass": true' /tmp/release-check.log

      - name: Install production workflows
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/puzzle-src
          mkdir -p "$root/.github/workflows" "$root/docs"
          touch "$root/.nojekyll"
          cat > "$root/.github/workflows/ci.yml" <<'YAML'
          name: Puzzle Arcade Release Gate
          on:
            push:
              branches: [main]
            pull_request:
            workflow_dispatch:
          permissions:
            contents: read
          jobs:
            release-gate:
              runs-on: ubuntu-latest
              timeout-minutes: 15
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                - run: node --check app.js
                - run: node --check word-content.js
                - run: node --check sw.js
                - run: node scripts/validate-word-content.js
                - run: node scripts/test-service-worker.mjs
                - run: node scripts/release-check.mjs
          YAML
          cat > "$root/.github/workflows/pages.yml" <<'YAML'
          name: Deploy Puzzle Arcade
          on:
            push:
              branches: [main]
            workflow_dispatch:
          permissions:
            contents: read
            pages: write
            id-token: write
          concurrency:
            group: puzzle-pages
            cancel-in-progress: true
          jobs:
            deploy:
              environment:
                name: github-pages
                url: ${{ steps.deployment.outputs.page_url }}
              runs-on: ubuntu-latest
              timeout-minutes: 15
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                - run: node scripts/release-check.mjs
                - run: node scripts/validate-word-content.js
                - run: node scripts/test-service-worker.mjs
                - name: Stage production runtime
                  run: |
                    mkdir -p dist
                    cp index.html styles.css app.js word-content.js manifest.webmanifest sw.js icon.svg icon-192.png icon-512.png dist/
                    touch dist/.nojekyll
                - uses: actions/configure-pages@v5
                  with:
                    enablement: true
                - uses: actions/upload-pages-artifact@v3
                  with:
                    path: dist
                - name: Deploy
                  id: deployment
                  uses: actions/deploy-pages@v4
          YAML
          cat > "$root/docs/RELEASE_STATUS.json" <<'JSON'
          {
            "version": "1.0.1",
            "cacheVersion": 18,
            "catalogGames": 36,
            "automatedReleaseGate": "PASS",
            "contentValidation": "PASS",
            "serviceWorkerRegression": "PASS",
            "manualPhysicalPwaUpdate": "NOT_INDEPENDENTLY_VERIFIED",
            "manualScreenReaderTesting": "NOT_INDEPENDENTLY_VERIFIED"
          }
          JSON

      - name: Promote exact verified tree to main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          main_sha="$(git rev-parse origin/main)"
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/puzzle-src/. "$GITHUB_WORKSPACE"/
          cd "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          tree_sha="$(git write-tree)"
          new_sha="$(printf '%s\n' 'release: Puzzle Arcade 1.0.1 audited fixes' | git commit-tree "$tree_sha" -p "$main_sha")"
          git push origin "$new_sha:refs/heads/main"
          git tag -f v1.0.1 "$new_sha"
          git push --force origin refs/tags/v1.0.1
          zip -qr /tmp/puzzle-arcade-v1.0.1.zip . -x '.git/*'
          gh release delete v1.0.1 --yes >/dev/null 2>&1 || true
          gh release create v1.0.1 /tmp/puzzle-arcade-v1.0.1.zip --title 'Puzzle Arcade 1.0.1' --notes-file RELEASE_NOTES.md
          echo "PROMOTION=PASS"
