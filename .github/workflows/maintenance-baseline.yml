name: Maintenance Baseline

on:
  workflow_dispatch:
  schedule:
    - cron: '41 5 * * 3'

permissions:
  contents: read

concurrency:
  group: puzzle-maintenance-baseline
  cancel-in-progress: true

jobs:
  static-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Cumulative maintenance baseline
        run: node scripts/release-check.mjs

  browser-resilience:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - run: |
          python -m pip install --disable-pip-version-check -r .github/requirements-ci.txt
          python -m playwright install --with-deps "${{ matrix.browser }}"
      - name: Cross-browser persistence resilience
        run: |
          set -euo pipefail
          python -m http.server 8080 >/tmp/puzzle-maintenance-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python scripts/test-resilience-browser.py --base-url http://127.0.0.1:8080/ --browser "${{ matrix.browser }}"

  chromium-maintenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - run: |
          python -m pip install --disable-pip-version-check -r .github/requirements-ci.txt
          python -m playwright install --with-deps chromium
      - name: Recovery and QoL drift certification
        run: |
          set -euo pipefail
          python -m http.server 8080 >/tmp/puzzle-maintenance-recovery-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python scripts/test-recovery-browser.py --base-url http://127.0.0.1:8080/
          python scripts/test-qol-browser.py --base-url http://127.0.0.1:8080/
