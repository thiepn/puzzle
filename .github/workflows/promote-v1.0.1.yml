name: Promote Puzzle Arcade 1.0.1

on:
  push:
    branches: [ship-v1.0.0]
    paths:
      - .github/workflows/promote-v1.0.1.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: puzzle-1-0-1-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruct verified source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t parts < <(find .deploy -maxdepth 1 -type f -name 'part-*' | sort -V)
          test "${#parts[@]}" -gt 0
          cat "${parts[@]}" | tr -d '\r\n' > /tmp/payload.b64
          base64 --decode /tmp/payload.b64 > /tmp/payload.bin
          echo "payload_sha256=$(sha256sum /tmp/payload.bin | awk '{print $1}')"
          rm -rf /tmp/puzzle-src && mkdir -p /tmp/puzzle-src
          if gzip -t /tmp/payload.bin >/dev/null 2>&1; then
            tar -xzf /tmp/payload.bin -C /tmp/puzzle-src
          elif xz -t /tmp/payload.bin >/dev/null 2>&1; then
            xz -dc /tmp/payload.bin | tar -xf - -C /tmp/puzzle-src
          elif unzip -t /tmp/payload.bin >/dev/null 2>&1; then
            unzip -q /tmp/payload.bin -d /tmp/puzzle-src
          elif tar -tf /tmp/payload.bin >/dev/null 2>&1; then
            tar -xf /tmp/payload.bin -C /tmp/puzzle-src
          else
            echo 'Invalid staged payload' >&2
            exit 1
          fi
          app_path="$(find /tmp/puzzle-src -maxdepth 5 -type f -name app.js -print -quit)"
          test -n "$app_path"
          root="$(dirname "$app_path")"
          echo "$root" > /tmp/puzzle-root
          for f in index.html styles.css app.js sw.js; do test -f "$root/$f"; done
          if [ ! -f "$root/word-content.js" ]; then
            test -f "$root/scripts/build-word-content.py"
            test -f "$root/content/word-content-source.json"
            (cd "$root" && python3 scripts/build-word-content.py)
          fi
          test -f "$root/word-content.js"

      - name: Re-run release certification
        shell: bash
        run: |
          set -euo pipefail
          root="$(cat /tmp/puzzle-root)"
          cd "$root"
          grep -q "const APP_VERSION = '1.0.1';" app.js
          grep -q 'puzzle-arcade-core-v18' sw.js
          node --check app.js
          node --check word-content.js
          node --check sw.js
          node scripts/validate-word-content.js
          node scripts/test-service-worker.mjs
          node scripts/release-check.mjs

      - name: Install production CI and Pages workflows
        shell: bash
        run: |
          set -euo pipefail
          root="$(cat /tmp/puzzle-root)"
          mkdir -p "$root/.github/workflows" "$root/docs"
          touch "$root/.nojekyll"
          cat > "$root/.github/workflows/ci.yml" <<'YAML'
          name: Puzzle Arcade Release Gate
          on:
            push:
              branches: [main]
            pull_request:
            workflow_dispatch:
          permissions:
            contents: read
          jobs:
            release-gate:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                - run: node --check app.js
                - run: node --check word-content.js
                - run: node --check sw.js
                - run: node scripts/validate-word-content.js
                - run: node scripts/test-service-worker.mjs
                - run: node scripts/release-check.mjs
          YAML
          cat > "$root/.github/workflows/pages.yml" <<'YAML'
          name: Deploy Puzzle Arcade
          on:
            push:
              branches: [main]
            workflow_dispatch:
          permissions:
            contents: read
            pages: write
            id-token: write
          concurrency:
            group: puzzle-pages
            cancel-in-progress: true
          jobs:
            deploy:
              environment:
                name: github-pages
                url: ${{ steps.deployment.outputs.page_url }}
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                - run: node scripts/release-check.mjs
                - run: node scripts/validate-word-content.js
                - run: node scripts/test-service-worker.mjs
                - name: Stage production runtime
                  run: |
                    mkdir -p dist
                    cp index.html styles.css app.js word-content.js manifest.webmanifest sw.js icon.svg icon-192.png icon-512.png dist/
                    touch dist/.nojekyll
                - uses: actions/configure-pages@v5
                  with:
                    enablement: true
                - uses: actions/upload-pages-artifact@v3
                  with:
                    path: dist
                - name: Deploy
                  id: deployment
                  uses: actions/deploy-pages@v4
          YAML
          cat > "$root/docs/RELEASE_STATUS.json" <<'JSON'
          {
            "version": "1.0.1",
            "cacheVersion": 18,
            "catalogGames": 36,
            "automatedReleaseGate": "PASS",
            "contentValidation": "PASS",
            "serviceWorkerRegression": "PASS",
            "manualPhysicalPwaUpdate": "NOT_INDEPENDENTLY_VERIFIED",
            "manualScreenReaderTesting": "NOT_INDEPENDENTLY_VERIFIED"
          }
          JSON

      - name: Create clean production commit
        id: production
        shell: bash
        run: |
          set -euo pipefail
          root="$(cat /tmp/puzzle-root)"
          git fetch origin main --depth=1
          main_sha="$(git rev-parse origin/main)"
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$root"/. "$GITHUB_WORKSPACE"/
          cd "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          tree_sha="$(git write-tree)"
          new_sha="$(printf '%s\n' 'release: Puzzle Arcade 1.0.1 audited fixes' | git commit-tree "$tree_sha" -p "$main_sha")"
          echo "main_parent=$main_sha"
          echo "production_commit=$new_sha"
          git push origin "$new_sha:refs/heads/main"
          git tag -f v1.0.1 "$new_sha"
          git push --force origin refs/tags/v1.0.1
          echo "sha=$new_sha" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          zip -qr /tmp/puzzle-arcade-v1.0.1.zip . -x '.git/*' 'dist/*'
          gh release delete v1.0.1 --yes >/dev/null 2>&1 || true
          if [ -f RELEASE_NOTES.md ]; then
            gh release create v1.0.1 /tmp/puzzle-arcade-v1.0.1.zip --title 'Puzzle Arcade 1.0.1' --notes-file RELEASE_NOTES.md
          else
            gh release create v1.0.1 /tmp/puzzle-arcade-v1.0.1.zip --title 'Puzzle Arcade 1.0.1' --notes 'Audited bug-fix release.'
          fi
          echo "PROMOTION=PASS"
