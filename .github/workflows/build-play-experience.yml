name: Verify Play Experience Upgrade
on:
  push:
    branches: [improve-play-experience-1.1]
    paths:
      - scripts/apply-play-experience.py
      - scripts/finalize-play-experience.py
      - scripts/play-experience-source.js
      - scripts/play-experience-source.css
      - scripts/test-play-experience.mjs
      - scripts/test-play-browser.py
      - .github/workflows/build-play-experience.yml
permissions:
  contents: write
defaults:
  run:
    shell: bash
concurrency:
  group: puzzle-play-experience-upgrade
  cancel-in-progress: true
jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply source-verified upgrade
        run: |
          python scripts/apply-play-experience.py
          python scripts/finalize-play-experience.py
          python -c "from pathlib import Path; p=Path('scripts/test-service-worker.mjs'); p.write_text(p.read_text().replace('v19','v20'))"
      - name: Complete release and game regressions
        run: |
          mkdir -p test-results
          node scripts/release-check.mjs | tee test-results/release.json
          node scripts/test-play-experience.mjs | tee test-results/play-node.json
      - name: Install browser test dependency
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Real HTTP browser verification
        run: |
          python -m http.server 8080 >/tmp/puzzle-http.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for attempt in 1 2 3 4 5; do
            curl -fsS http://127.0.0.1:8080/ >/dev/null && break
            sleep 1
          done
          python scripts/test-play-browser.py
      - name: Commit verified production source
        run: |
          rm scripts/apply-play-experience.py scripts/finalize-play-experience.py scripts/play-experience-source.js scripts/play-experience-source.css
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js styles.css sw.js README.md CHANGELOG.md RELEASE_NOTES.md scripts
          git commit -m 'feat: improve all 36 puzzle play experiences and word save recovery'
          git push origin HEAD:improve-play-experience-1.1
      - name: Upload verification evidence and source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: play-experience-verification
          path: |
            test-results/
            app.js
            styles.css
            sw.js
            README.md
            RELEASE_NOTES.md
            scripts/
          retention-days: 7
