name: Verify v1.2 Phase 7 Results Rewards

on:
  push:
    branches: [v1.2-phase7-results-rewards]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: puzzle-v1-2-phase7-results-rewards
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Full release, reward, and gameplay regression gate
        run: |
          node --check app.js
          node --check word-content.js
          node --check sw.js
          node scripts/validate-word-content.js
          node scripts/test-service-worker.mjs
          node scripts/test-word-entry.mjs
          node scripts/test-play-experience.mjs
          node scripts/release-check.mjs
      - name: Install Chromium harness
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Real browser completion verification
        run: |
          python -m http.server 8080 >/tmp/puzzle-http.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for attempt in 1 2 3 4 5; do
            curl -fsS http://127.0.0.1:8080/ >/dev/null && break
            sleep 1
          done
          python scripts/test-play-browser.py --base-url http://127.0.0.1:8080/
      - name: Upload Phase 7 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-2-phase7-results-rewards-evidence
          path: test-results/play-browser/
          retention-days: 7
